name: Feature request
description: Suggest an idea, integration, or improvement.
title: "[feat]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the user pain or workflow gap. "I'm always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would the ideal behavior look like? CLI flag, config option, integration?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, workarounds, or related tools you've tried.
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Screenshots, links, prior art — anything that helps.
